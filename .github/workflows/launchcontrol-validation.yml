name: LaunchControl validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify project structure and security contracts
        run: python scripts/verificar_projeto.py

      - name: Check syntax of every frontend JavaScript file
        run: find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build deployable WAR
        run: mvn -B -f backend/pom.xml clean package

      - name: Start isolated MySQL 8.4 test database
        run: |
          set -euo pipefail
          docker network create launchcontrol-ci
          docker run -d --name launchcontrol-mysql --network launchcontrol-ci \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=launchcontrol mysql:8.4
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec launchcontrol-mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs launchcontrol-mysql
            exit 1
          fi

      - name: Apply SQL scripts to a clean database and verify re-execution
        run: |
          set -euo pipefail
          for migration in \
            banco-de-dados/modelo.sql \
            banco-de-dados/migracoes/001_ecossistema_automotivo.sql \
            banco-de-dados/migracoes/002_aprovacoes_notificacoes.sql \
            banco-de-dados/migracoes/003_agenda_auditoria_integracoes.sql; do
            docker exec -i launchcontrol-mysql mysql -uroot -proot < "$migration"
          done
          docker exec launchcontrol-mysql mysql -uroot -proot -D launchcontrol -e "SHOW TABLES"
          echo "Reexecutando os quatro scripts para verificar idempotência..."
          for migration in \
            banco-de-dados/modelo.sql \
            banco-de-dados/migracoes/001_ecossistema_automotivo.sql \
            banco-de-dados/migracoes/002_aprovacoes_notificacoes.sql \
            banco-de-dados/migracoes/003_agenda_auditoria_integracoes.sql; do
            docker exec -i launchcontrol-mysql mysql -uroot -proot < "$migration"
          done

      - name: Seed isolated test fixtures and verify application database account
        run: |
          set -euo pipefail
          docker exec launchcontrol-mysql mysql -uroot -proot -e "CREATE USER 'lc_ci'@'%' IDENTIFIED BY 'lc_ci_password'; GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, REFERENCES ON launchcontrol.* TO 'lc_ci'@'%'; FLUSH PRIVILEGES;"
          docker exec -i launchcontrol-mysql mysql -uroot -proot < scripts/seed_smoke_test.sql
          docker run --rm --network launchcontrol-ci mysql:8.4 mysql -h launchcontrol-mysql -ulc_ci -plc_ci_password -D launchcontrol -e "SELECT COUNT(*) AS seeded_users FROM usuarios"

      - name: Deploy WAR to Tomcat 11 with Java 25
        run: |
          set -euo pipefail
          docker run -d --name launchcontrol-tomcat --network launchcontrol-ci -p 8080:8080 \
            -e 'LC_DB_URL=jdbc:mysql://launchcontrol-mysql:3306/launchcontrol?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -e 'LC_DB_USER=lc_ci' \
            -e 'LC_DB_PASSWORD=lc_ci_password' \
            -v "$PWD/backend/target/launchcontrol.war:/usr/local/tomcat/webapps/launchcontrol.war:ro" \
            tomcat:11-jdk25-temurin

      - name: Verify runtime configuration and MySQL DNS
        run: |
          set -euo pipefail
          docker exec launchcontrol-tomcat sh -c 'test -n "$LC_DB_URL" && test -n "$LC_DB_USER" && test -n "$LC_DB_PASSWORD"'
          docker exec launchcontrol-tomcat getent hosts launchcontrol-mysql

      - name: Wait for application health and run business-flow smoke tests
        env:
          LAUNCHCONTROL_BASE_URL: http://127.0.0.1:8080/launchcontrol
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 3 "$LAUNCHCONTROL_BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Health endpoint did not become ready."
            docker logs launchcontrol-tomcat
            docker logs launchcontrol-mysql
            exit 1
          fi
          python scripts/smoke_test_http.py

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs launchcontrol-tomcat || true
          docker logs launchcontrol-mysql || true

      - name: Clean up integration-test containers
        if: always()
        run: |
          docker rm -f launchcontrol-tomcat launchcontrol-mysql 2>/dev/null || true
          docker network rm launchcontrol-ci 2>/dev/null || true
