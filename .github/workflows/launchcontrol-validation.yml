name: LaunchControl validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Structural checks
        run: python scripts/verificar_projeto.py

      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/interacoes.js
          node --check frontend/js/recursos-complementares.js

      - name: Build WAR
        run: mvn -B -f backend/pom.xml clean package
