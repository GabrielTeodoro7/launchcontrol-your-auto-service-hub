name: LaunchControl checks

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "backend/**"
      - ".github/workflows/launchcontrol-servlet.yml"
      - "README.md"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "banco-de-dados/**"
      - "scripts/**"
      - ".github/workflows/launchcontrol-servlet.yml"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Maven 3.10.0
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.10.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural checks
        working-directory: .
        run: python scripts/verificar_projeto.py
      - name: Check JavaScript syntax
        run: node --check frontend/js/interacoes.js
      - name: Show build toolchain
        run: mvn -version
      - name: Build WAR
        run: mvn -B -f backend/pom.xml clean package
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchcontrol-servlet-war
          path: backend/target/launchcontrol.war
          if-no-files-found: error
          retention-days: 14
