name: LaunchControl checks

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "launchcontrol-servlet/**"
      - ".github/workflows/launchcontrol-servlet.yml"
      - "README.md"
  pull_request:
    paths:
      - "launchcontrol-servlet/**"
      - ".github/workflows/launchcontrol-servlet.yml"
      - "README.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Maven 3.10.0
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: "3.10.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural checks
        working-directory: launchcontrol-servlet
        run: python scripts/check_project.py
      - name: Check JavaScript syntax
        run: node --check launchcontrol-servlet/src/main/webapp/js/app.js
      - name: Show build toolchain
        run: mvn -version
      - name: Build WAR
        run: mvn -B -f launchcontrol-servlet/pom.xml clean package
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchcontrol-servlet-war
          path: launchcontrol-servlet/target/launchcontrol.war
          if-no-files-found: error
          retention-days: 14
